<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Try BDD Expressions in your browser. Match step text and inspect named and positional parameters."
    />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <title>Playground · BDD Expressions</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header>
      <a class="brand" href="%BASE_URL%">{ bdd-expressions }</a>
      <nav aria-label="Main">
        <a aria-current="page" href="%BASE_URL%">Playground</a
        ><a href="%BASE_URL%syntax/">Syntax guide</a>
      </nav>
      <div class="header-actions">
        <a href="https://github.com/vitalets/bdd-expressions">GitHub ↗</a>
      </div>
    </header>
    <main aria-label="Expression playground">
      <div class="panel workspace">
        <section class="editor" aria-label="Expression editor">
          <div class="expression-heading">
            <label for="expression">Expression</label>
            <button id="share" type="button" aria-live="polite">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <rect x="8" y="8" width="12" height="12" rx="2" />
                <path d="M16 8V4H4v12h4" /></svg
              ><span>Copy link</span>
            </button>
          </div>
          <div class="input-control">
            <input
              id="expression"
              type="text"
              spellcheck="false"
              autocomplete="off"
              value="I have :count{int} cucumber(s)"
            />
            <button
              type="button"
              class="clear-input"
              data-clear="expression"
              aria-label="Clear expression"
              hidden
            >
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 7 10 10M17 7 7 17" /></svg>
            </button>
          </div>
          <div class="examples" role="group" aria-label="Try an example">
            <button type="button" data-example="0">I have :count{int} cucumber(s)</button>
            <button type="button" data-example="1">I create :item( as :owner)</button>
            <button type="button" data-example="2">I (click/tap on/press and hold) :target</button>
            <button type="button" data-example="3">Set :status{pending/approved/rejected}</button>
          </div>
          <div class="input-heading">
            <label for="input">Input text</label>
            <span id="status" class="badge" role="status">Evaluating…</span>
          </div>
          <div class="input-control">
            <input
              id="input"
              aria-describedby="status"
              type="text"
              spellcheck="false"
              autocomplete="off"
              value="I have 2 cucumbers"
            />
            <button
              type="button"
              class="clear-input"
              data-clear="input"
              aria-label="Clear input text"
              hidden
            >
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 7 10 10M17 7 7 17" /></svg>
            </button>
          </div>
        </section>
        <section
          class="results"
          aria-label="Evaluation results"
          aria-live="polite"
          aria-atomic="true"
        >
          <p id="message" hidden></p>
          <div class="result-values">
            <div>
              <h3>Positional params</h3>
              <pre id="positional">—</pre>
            </div>
            <div>
              <h3>Named params</h3>
              <pre id="named">—</pre>
            </div>
          </div>
          <details>
            <summary>Compiled regular expression</summary>
            <pre id="regexp">—</pre>
          </details>
        </section>
      </div>
      <p class="footnote">Runs locally in your browser.</p>
      <noscript
        >This playground requires JavaScript. The syntax guide is available without it.</noscript
      >
    </main>
    <script type="module" src="./playground.ts"></script>
  </body>
</html>
