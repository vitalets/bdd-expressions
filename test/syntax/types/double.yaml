- name: double converts zero
  expression: '{double}'
  text: '0'
  params:
    positional: [0]
    named: {}

- name: double converts negative decimals
  expression: '{double}'
  text: '-1.25'
  params:
    positional: [-1.25]
    named: {}

- name: double converts signed fractions without an integer part
  expression: '{double}'
  text: '+.5'
  params:
    positional: [0.5]
    named: {}

- name: double converts positive exponents
  expression: '{double}'
  text: '1E+2'
  params:
    positional: [100]
    named: {}

- name: double converts negative exponents
  expression: '{double}'
  text: '1E-2'
  params:
    positional: [0.01]
    named: {}

- name: double rejects empty input
  expression: '{double}'
  text: ''
  match: false

- name: double rejects a bare decimal point
  expression: '{double}'
  text: '.'
  match: false

- name: double rejects trailing decimal points
  expression: '{double}'
  text: '1.'
  match: false

- name: double rejects lowercase exponents
  expression: '{double}'
  text: '1e2'
  match: false

- name: double rejects grouping separators
  expression: '{double}'
  text: '1,000'
  match: false

- name: double rejects NaN
  expression: '{double}'
  text: 'NaN'
  match: false

- name: double rejects infinity
  expression: '{double}'
  text: 'Infinity'
  match: false
