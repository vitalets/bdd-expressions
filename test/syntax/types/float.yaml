- name: float converts zero
  expression: '{float}'
  text: '0'
  params:
    positional: [0]
    named: {}

- name: float converts negative decimals
  expression: '{float}'
  text: '-1.25'
  params:
    positional: [-1.25]
    named: {}

- name: float converts signed fractions without an integer part
  expression: '{float}'
  text: '+.5'
  params:
    positional: [0.5]
    named: {}

- name: float converts uppercase exponents
  expression: '{float}'
  text: '1E2'
  params:
    positional: [100]
    named: {}

- name: float converts negative fractions with negative exponents
  expression: '{float}'
  text: '-.1E-2'
  params:
    positional: [-0.001]
    named: {}

- name: float rejects empty input
  expression: '{float}'
  text: ''
  match: false

- name: float rejects a bare decimal point
  expression: '{float}'
  text: '.'
  match: false

- name: float rejects trailing decimal points
  expression: '{float}'
  text: '1.'
  match: false

- name: float rejects lowercase exponents
  expression: '{float}'
  text: '1e2'
  match: false

- name: float rejects grouping separators
  expression: '{float}'
  text: '1,000'
  match: false

- name: float rejects NaN
  expression: '{float}'
  text: 'NaN'
  match: false

- name: float rejects infinity
  expression: '{float}'
  text: 'Infinity'
  match: false
