name: test

on:
  push:
    branches: ['**', '!docs']
    paths:
      - '.github/workflows/test.yaml'
      - 'src/**'
      - 'test/**'
      - 'package*.json'
      - 'tsconfig*.json'
      - '.npmrc'
  pull_request:
    branches: [main]
    paths:
      # no way to avoid repeating the paths here
      - '.github/workflows/test.yaml'
      - 'src/**'
      - 'test/**'
      - 'package*.json'
      - 'tsconfig*.json'
      - '.npmrc'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
